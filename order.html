<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Online | The Brew Haven</title>
  <meta name="description" content="The Brew Haven - Premium Coffee & Milk Tea">
  <link rel="stylesheet" href="assets/css/style.css">
  
</head>
<body>
  <div id="header-container"></div>

  <main>
    
  <section class="section page-header">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Order Now</span>
        <h1 class="section-title">Order Online</h1>
        <p class="section-subtitle">Browse our menu, customize your drinks, and choose pickup or delivery.</p>
      </div>

      <div class="order-layout">
        <div>
          <div class="menu-grid" id="order-menu-grid"></div>
        </div>

        <div class="cart-sidebar">
          <h3 style="font-family:var(--font-heading); color:var(--coffee-brown); margin-bottom:1rem;">Your Order</h3>
          <div id="cart-items">
            <div class="cart-empty">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              <p>Your cart is empty</p>
              <p style="font-size:0.875rem; margin-top:0.5rem;">Add items from the menu to get started</p>
            </div>
          </div>
          <div class="cart-total">
            <span>Total</span>
            <span id="cart-total-price">$0.00</span>
          </div>

          <form name="order" method="POST" data-netlify="true" action="thank-you.html" netlify-honeypot="bot-field" id="order-form" style="margin-top:1.5rem;">
            <p class="hidden" style="display:none;"><input name="bot-field" /></p>
            <input type="hidden" name="form-name" value="order">

            <div class="form-group">
              <label class="form-label">Pickup or Delivery *</label>
              <select name="order_type" class="form-select" required>
                <option value="pickup">Pickup</option>
                <option value="delivery">Delivery</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="customer_name" class="form-input" placeholder="Your name" required>
            </div>

            <div class="form-group">
              <label class="form-label">Phone *</label>
              <input type="tel" name="customer_phone" class="form-input" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" name="customer_email" class="form-input" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
              <label class="form-label">Delivery Address</label>
              <input type="text" name="delivery_address" class="form-input" placeholder="123 Main St, City">
              <p class="form-hint">Required for delivery orders</p>
            </div>

            <div class="form-group">
              <label class="form-label">Payment Method *</label>
              <select name="payment" class="form-select" required>
                <option value="">Select payment</option>
                <option value="cash">Cash on Pickup</option>
                <option value="card">Credit/Debit Card</option>
                <option value="gcash">GCash</option>
                <option value="paypal">PayPal</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Notes</label>
              <textarea name="order_notes" class="form-textarea" placeholder="Any special instructions?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Place Order</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  </main>

  <div id="footer-container"></div>

  
  <!-- Order Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Customize Your Order</h3>
        <button class="modal-close" onclick="closeOrderModal()" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="order-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeOrderModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmAddToCart()">Add to Cart</button>
      </div>
    </div>
  </div>

  
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxPrev()" aria-label="Previous"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightbox-img">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNext()" aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>


  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  
</body>
</html>
