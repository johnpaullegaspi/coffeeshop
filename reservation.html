<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations | The Brew Haven</title>
  <meta name="description" content="The Brew Haven - Premium Coffee & Milk Tea">
  <link rel="stylesheet" href="assets/css/style.css">
  
</head>
<body>
  <div id="header-container"></div>

  <main>
    
  <section class="section" style="padding-top:10rem;">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Book Your Table</span>
        <h1 class="section-title">Reservations</h1>
        <p class="section-subtitle">Reserve your spot for a cozy dining experience. Perfect for dates, meetings, or catching up with friends.</p>
      </div>

      <div style="max-width:700px; margin:0 auto;">
        <form name="reservation" method="POST" data-netlify="true" action="thank-you.html" netlify-honeypot="bot-field" class="reveal" id="reservation-form">
          <p class="hidden" style="display:none;"><input name="bot-field" /></p>
          <input type="hidden" name="form-name" value="reservation">

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="name" class="form-input" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label class="form-label">Contact Number *</label>
              <input type="tel" name="phone" class="form-input" placeholder="+1 (555) 000-0000" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Date *</label>
              <input type="date" name="date" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Time *</label>
              <input type="time" name="time" class="form-input" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Number of Guests *</label>
              <select name="guests" class="form-select" required>
                <option value="">Select guests</option>
                <option value="1">1 Guest</option>
                <option value="2">2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6">6 Guests</option>
                <option value="7+">7+ Guests</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Occasion</label>
              <select name="occasion" class="form-select">
                <option value="">Select occasion</option>
                <option value="casual">Casual Dining</option>
                <option value="birthday">Birthday</option>
                <option value="anniversary">Anniversary</option>
                <option value="business">Business Meeting</option>
                <option value="date">Date Night</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Seating Preference</label>
            <select name="seating" class="form-select">
              <option value="">No preference</option>
              <option value="indoor">Indoor</option>
              <option value="outdoor">Outdoor Patio</option>
              <option value="window">Window Seat</option>
              <option value="quiet">Quiet Corner</option>
              <option value="bar">Coffee Bar</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Special Requests / Notes</label>
            <textarea name="notes" class="form-textarea" placeholder="Any dietary restrictions, celebrations, or special requests?"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Confirm Reservation</button>
          <p class="form-hint" style="text-align:center; margin-top:1rem;">You will receive a confirmation email shortly after submission.</p>
        </form>
      </div>
    </div>
  </section>

  </main>

  <div id="footer-container"></div>

  
  <!-- Order Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Customize Your Order</h3>
        <button class="modal-close" onclick="closeOrderModal()" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="order-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeOrderModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmAddToCart()">Add to Cart</button>
      </div>
    </div>
  </div>

  
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxPrev()" aria-label="Previous"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightbox-img">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNext()" aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>


  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  
</body>
</html>
